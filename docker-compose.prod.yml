version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: florasense_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_TABLE}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    container_name: florasense_api_prod
    restart: unless-stopped
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - DB_HOST=db
      - PORT=3333
    command: sh -c "npx sequelize-cli db:migrate && node dist/main.js"

volumes:
  pgdata_prod:
