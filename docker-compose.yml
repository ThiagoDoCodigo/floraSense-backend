version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: florasense_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_TABLE}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: builder
    container_name: florasense_api_dev
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx sequelize-cli db:migrate && tail -f /dev/null"

volumes:
  pgdata_dev:
